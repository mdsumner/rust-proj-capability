[package]
name = "projections-engines"
version = "0.1.0"
edition = "2021"
publish = false

# One binary, one module per engine. proj4rs appears twice: the latest
# crates.io release and the main branch (pinned by Cargo.lock; the nightly
# workflow runs `cargo update` on that git package to follow it).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proj4rs = "=0.2.1"
proj4rs-main = { package = "proj4rs", git = "https://github.com/3liz/proj4rs", branch = "main" }
proj-core = { version = "=0.12.0", default-features = false }
proj-wkt = "0.12"
wbprojection = "=0.3.3"
geodesy = { version = "=0.15.0", default-features = false }
terrio-crs = { version = "=0.1.0", default-features = false, features = ["wbprojection-fallback"] }
