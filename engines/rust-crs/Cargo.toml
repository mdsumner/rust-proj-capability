[package]
name = "capability-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proj = { version = "=0.31.0", optional = true, default-features = false }
proj-sys = { version = "=0.27.0", optional = true }
proj4rs = { version = "=0.2.1", optional = true }
proj4wkt = { version = "=0.1.1", optional = true }
crs-definitions = { version = "=0.6.0", optional = true }
geodesy = { version = "=0.15.0", optional = true, default-features = false }
miniproj = { version = "=0.10.4", optional = true }
proj-core = { version = "=0.11.0", optional = true }
proj-wkt = { version = "=0.11.0", optional = true }
wbprojection = { version = "=0.3.3", optional = true }

[features]
default = ["c-proj", "c-proj4rs", "c-crsdefs", "c-geodesy", "c-miniproj", "c-projcore", "c-wbprojection"]
c-proj = ["dep:proj", "dep:proj-sys"]
c-proj4rs = ["dep:proj4rs", "dep:proj4wkt"]
c-crsdefs = ["dep:crs-definitions", "c-proj4rs"]
c-geodesy = ["dep:geodesy"]
c-miniproj = ["dep:miniproj"]
c-projcore = ["dep:proj-core", "dep:proj-wkt"]
c-wbprojection = ["dep:wbprojection"]
# compile-only probe: does proj::Proj implement Send + Sync? (expected: no)
c-proj-send-sync-probe = ["c-proj"]
